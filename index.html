<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>TACTICS 7 Ver.0.45</title><link rel="stylesheet" href="style.css"></head><body>
<main class="arena">
<div class="battleAtmosphere" aria-hidden="true"><div class="farWall"></div><div class="enemyGate"></div><div class="plazaSeal"></div><div class="nearBastion"></div><div class="plazaPillar pillarLeft"></div><div class="plazaPillar pillarRight"></div></div>
<header class="arenaTop"><div class="brand">TACTICS <b>7</b><small>Ver.0.45</small></div><div id="phase" class="phase"></div><div class="topActions"><button id="cardDetailToggle" title="選択カードの詳細" aria-label="カード詳細">カード</button><button id="infoToggle" title="詳細" aria-label="詳細情報">詳細</button><button id="logToggle" title="ログ" aria-label="履歴">履歴</button><button id="graveToggle" title="墓地" aria-label="墓地">墓地</button><button id="debugToggle" title="設定" aria-label="設定">設定</button><button id="newGame" title="新しい試合" aria-label="新しい試合">↻</button></div></header>
<section id="cpuStatus" class="status enemyStatus"></section>
<section class="field"><div class="battleCenter"><div id="board" class="board" aria-label="7×7戦場"></div><svg id="aimLines" class="aimLines" viewBox="0 0 700 700" aria-hidden="true"></svg><div id="fxLayer" class="fxLayer"></div></div><div class="battleHud"><div id="centerInfo" class="objective"></div><div id="resourceNotice" class="resourceNotice"></div><div class="fieldRight"><div class="turnBox"><strong id="turnLabel">YOUR TURN</strong><span id="actionRemain">残り行動 3/3</span></div><div id="focusSummary" class="focusSummary">ユニットかカードを選択</div><div id="actions" class="actions"></div><button id="evolve" disabled>◆ 進化</button><button id="cancel" hidden>選択解除</button><button id="endTurn" class="endTurn">ターン終了 <span>▶</span></button></div></div></section>
<section id="playerStatus" class="status playerStatus"></section>
<div id="hint" class="hint" role="status">デッキを選択してください</div>
<section class="handDock"><div id="hand" class="hand"></div><div id="cardPreview" class="cardPreview" hidden></div><span id="handInfo" class="handInfo"></span></section>
<div id="decision" class="decision" hidden></div><div id="beginnerGuide" class="beginnerGuide" hidden><span></span><button id="guideSkip">スキップ</button></div><div id="turnBanner" class="turnBanner" hidden></div><div id="toast" class="toast" hidden></div>
</main>
<div id="modal" class="overlay"><div id="dialog" class="dialog"></div></div>
<div id="infoPanel" class="utilityOverlay" hidden><div class="utilityHead"><strong>詳細情報</strong><button id="closeInfo">閉じる</button></div><div id="selected">駒またはカードを選択</div><div id="matchInfo"></div></div>
<div id="logPanel" class="utilityOverlay" hidden><div class="utilityHead"><strong>バトル履歴</strong><button id="closeLog">閉じる</button></div><ol id="log"></ol></div>
<div id="gravePanel" class="utilityOverlay" hidden><div class="utilityHead"><strong>墓地</strong><button id="closeGrave">閉じる</button></div><div id="graveInfo"></div></div>
<div id="cardDetailPanel" class="utilityOverlay cardDetailPanel" hidden><div class="utilityHead"><strong>カード詳細</strong><button id="closeCardDetail" aria-label="詳細を閉じる">閉じる</button></div><div id="cardDetailContent"></div></div>
<div id="debugPanel" class="utilityOverlay" hidden><div class="utilityHead"><strong>デバッグ</strong><button id="closeDebug">閉じる</button></div><label>CPU思考速度 <select id="cpuSpeed"><option value="0">即時</option><option value="150">速い</option><option value="400" selected>普通</option><option value="900">遅い</option></select></label><button id="maxEp">EPを2にする</button><button id="drawCard">1枚引く</button><button id="debugReset">リセット</button><div id="hpList"></div></div>
<div class="portraitPrompt">端末を横向きにしてください</div>
<script src="data.js"></script><script src="research_data.js"></script><script src="lab_v12_data.js"></script><script src="lab_v13_data.js"></script><script src="phase1_data.js"></script><script src="candidate_overrides.js"></script><script src="lab_config.js"></script><script src="engine.js"></script><script src="lab_ai.js"></script><script src="card_detail.js"></script><script src="playtest_config.js"></script><script src="cloud_sync.js"></script><script src="playtest.js"></script><script src="ui.js"></script></body></html>
