<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TACTICS 7 CORE LAB · Human Analyst 0.42</title>
<style>body{font:15px system-ui;background:#101b29;color:#e5ecf3;margin:2rem;line-height:1.5}button,select,input{font:inherit;padding:.5rem;border-radius:.4rem}button{background:#69a4ce;cursor:pointer}.panel{background:#1d3042;padding:1rem;border-radius:.6rem;margin:1rem 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #6c8290;padding:.3rem .6rem;text-align:left}pre{white-space:pre-wrap;max-height:55vh;overflow:auto}a{color:#9ed2ff}label{display:inline-block;margin:.2rem}.humanTools{border-top:1px solid #52697b;margin-top:1rem;padding-top:1rem}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem}.kpis div,.candidate{background:#132334;border:1px solid #486277;border-radius:.5rem;padding:.7rem}.kpis strong,.kpis small,.candidate small{display:block}.kpis strong{font-size:1.45rem}.candidateGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:.8rem;margin:1rem 0}.candidate{margin:.45rem 0}.candidate.p0{border-color:#ff6868}.candidate.p1{border-color:#f6b84a}.sampleWarning{background:#5b431b;padding:.8rem;border-radius:.5rem}.muted{color:#a9bac8}.tableWrap{overflow:auto}.filterRow{display:flex;gap:.4rem;flex-wrap:wrap}.autoReport details{margin:.7rem 0;background:#16283a;padding:.7rem;border-radius:.5rem}.autoReport summary{cursor:pointer;font-weight:700}.productionGuard,.gate{padding:.8rem;border-radius:.5rem;margin:.6rem 0}.productionGuard{background:#10283c;border:1px solid #6fa3ca}.gate{background:#3b311d}.improveCard{background:#122536;border:1px solid #536f85;padding:1rem;border-radius:.6rem;margin:.8rem 0}.improveCard header{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}.improveCard header span{background:#7b2d8e;padding:.2rem .4rem;border-radius:.3rem}.improveCard header em{margin-left:auto}.abResult{background:#183a31;padding:.6rem;border-radius:.4rem}</style></head><body>
<h1>TACTICS 7 CORE LAB · Human Analyst 0.42</h1><p>Human Playtestの集計・候補抽出と、同じルールエンジンによる自動対戦を扱います。分析結果からゲームを自動変更することはありません。</p>
<div class="panel"><label>召喚ターン <select id="summonMode"><option value="immobile">A：0マス</option><option value="oneStep">B：1マス</option><option value="moveOnly" selected>C：通常移動</option></select></label><label><input id="frontline" type="checkbox" checked> 前線召喚ON</label><label>ペア数 <input id="pairs" type="number" min="1" max="500" value="10"></label><label>seed <input id="seed" type="number" value="1"></label><label>AI <select id="persona"></select></label><label>強度 <select id="strength"><option>Strong</option><option>Search</option><option>Basic</option></select></label><br><label>自分 <select id="deckA"></select></label><label>相手 <select id="deckB"></select></label><br><button id="run">先後ペア比較</button> <button id="all">18デッキ総当たり</button> <button id="cores">召喚A/B/C × 前線ON/OFF</button> <button id="adCompare">Core A vs D（中央非依存デッキ）</button> <button id="dCompare">D1 vs D2（同コスト攻城カード）</button> <button id="export">結果JSONを保存</button><div class="humanTools"><h2>Human Playtest Auto Analyst</h2><label>Human JSON <input id="humanImport" type="file" accept="application/json" multiple></label><button id="humanLocal">端末ログを読込</button><details><summary>管理者クラウド同期</summary><label>Admin endpoint <input id="cloudEndpoint" size="45"></label><label>一時Admin token <input id="cloudToken" type="password" autocomplete="off"></label><button id="humanCloud">クラウドから同期</button><small>Tokenは保存しません。一般プレイヤーにはREAD権限がありません。</small></details><div class="filterRow" id="versionFilters"></div><button id="humanAnalyze">Human Auto Reportを分析</button> <button id="improvementOpen">Auto Improvement Lab</button> <button id="humanReportExport">Report JSON</button> <button id="imitationExport">Human Imitation Dataset</button></div></div>
<div id="progress"></div><div id="humanResults" class="panel" hidden></div><div id="improvementResults" class="panel" hidden></div><div id="results" class="panel">試合を選択してください。</div>
<script src="data.js"></script><script src="research_data.js"></script><script src="lab_v12_data.js"></script><script src="lab_v13_data.js"></script><script src="phase1_data.js"></script><script src="lab_config.js"></script><script src="engine.js"></script><script src="lab_ai.js"></script><script src="lab_sim.js"></script><script src="playtest_config.js"></script><script src="cloud_sync.js"></script><script src="playtest.js"></script><script src="human_playtest_lab.js"></script><script src="human_auto_analyst.js"></script><script src="human_auto_report_ui.js"></script><script src="auto_improvement_lab.js"></script><script src="auto_improvement_ui.js"></script><script src="cloud_admin.js"></script><script>
const $=id=>document.getElementById(id);let last=[];for(const p of CoreAI.personalities)$('persona').add(new Option(p,p));for(const id of [...RULES.research.decks,...(RULES.phase1?.decks||[])])for(const side of ['deckA','deckB'])$(side).add(new Option(RULES.decks[id].name,id));$('deckB').selectedIndex=3;
function fmt(v){return Number.isFinite(v)?(v*100).toFixed(1)+'%':'—'}
function show(rows){last=rows;let a=CoreLab.analyze(rows),s=a.summary,cores=[...new Set(rows.map(r=>r.experiment_id||r.coreId))].join(', ');$('results').innerHTML=`<h2>結果 · ${cores}</h2><p>${s.n}試合 / 決着${s.decided} · 先攻 ${fmt(s.firstWinRate)} (95% Wilson ${fmt(s.firstCI[0])}–${fmt(s.firstCI[1])}) · 平均${s.meanTurns.toFixed(1)}手番</p><p>ENERGY使用率 ${fmt(a.energy.rate)} · 近接${a.damage.melee||0} / 射撃${a.damage.ranged_projectile||0} / 魔法${a.damage.magic||0} / スペル${a.damage.spell||0}</p><p>中央キャンプ ${a.camp.center.sideGames}陣営試合 / 防衛キャンプ ${a.camp.defense.sideGames}陣営試合</p><details><summary>遠距離とキャンプの詳細</summary><pre>${JSON.stringify({ranged:a.ranged,camp:a.camp},null,2)}</pre></details><details><summary>先頭3試合の設定と結果</summary><pre>${JSON.stringify(rows.slice(0,3),null,2)}</pre></details>`;let ids=[...new Set(rows.map(r=>r.experiment_id||r.coreId))];if(ids.length>1)$('results').innerHTML+=`<table><tr><th>条件</th><th>決着/試合</th><th>先攻勝率</th><th>平均手番</th></tr>${ids.map(id=>{let b=CoreLab.aggregate(rows.filter(r=>(r.experiment_id||r.coreId)===id));return `<tr><td>${id}</td><td>${b.decided}/${b.n}</td><td>${fmt(b.firstWinRate)}</td><td>${b.meanTurns.toFixed(1)}</td></tr>`}).join('')}</table>`;$('progress').textContent='完了'}
async function batch(jobs){last=[];$('progress').textContent=`0 / ${jobs.length}`;for(let i=0;i<jobs.length;i++){last.push(CoreLab.play(jobs[i]));if(i%10===0){$('progress').textContent=`${i+1} / ${jobs.length}`;await new Promise(r=>setTimeout(r,0))}}show(last)}
function base(){let mode=$('summonMode').value,front=$('frontline').checked,playerDeck=$('deckA').value,cpuDeck=$('deckB').value,phase1=playerDeck.startsWith('p1_')||cpuDeck.startsWith('p1_');return phase1?{coreId:'D',strictCore:true,...RULES.phase1.core,experiment_id:'phase1_F1_H2_G2R',seed:+$('seed').value,playerDeck,cpuDeck,playerAI:$('persona').value,cpuAI:$('persona').value,strength:$('strength').value}:{coreId:'CUSTOM',config:{summonTempo:mode,frontlineSummon:front},experiment_id:`summon_${mode}_${front?'on':'off'}`,seed:+$('seed').value,playerDeck,cpuDeck,playerAI:$('persona').value,cpuAI:$('persona').value,strength:$('strength').value}}
$('run').onclick=()=>{let o=base(),jobs=[];for(let i=0;i<+$('pairs').value;i++){let seed=o.seed+i,pairId=`pair_${seed}`;for(const [pairArm,firstSide] of [['A','player'],['B','cpu']])jobs.push({...o,seed,pairId,pairArm,firstSide})}batch(jobs)};
$('all').onclick=()=>{let o=base(),jobs=[],d=RULES.research.decks;for(let i=0;i<d.length;i++)for(let j=i;j<d.length;j++)for(const firstSide of ['player','cpu'])jobs.push({...o,playerDeck:d[i],cpuDeck:d[j],seed:o.seed+i*100+j,firstSide});batch(jobs)};
$('cores').onclick=()=>{let o=base(),jobs=[];for(const [mode,tempo] of Object.entries({A:'immobile',B:'oneStep',C:'moveOnly'}))for(const front of [true,false])for(let i=0;i<+$('pairs').value;i++)for(const firstSide of ['player','cpu'])jobs.push({...o,config:{summonTempo:tempo,frontlineSummon:front},experiment_id:`summon_${mode}_${front?'on':'off'}`,seed:o.seed+i,pairId:`${mode}_${front}_${o.seed+i}`,pairArm:firstSide==='player'?'A':'B',firstSide});batch(jobs)};
$('adCompare').onclick=()=>{let o=base(),jobs=[],safe=id=>RULES.decks['dcgsafe_'+id]?'dcgsafe_'+id:id;for(const coreId of ['A','D'])for(let i=0;i<+$('pairs').value;i++)for(const firstSide of ['player','cpu'])jobs.push({...o,coreId,config:undefined,playerDeck:safe(o.playerDeck),cpuDeck:safe(o.cpuDeck),experiment_id:`core_${coreId}_center_test`,seed:o.seed+i,pairId:`AD_${o.seed+i}`,pairArm:firstSide==='player'?'A':'B',firstSide});batch(jobs)};
$('dCompare').onclick=()=>{let o=base(),jobs=[];for(let i=0;i<SiegeLab.decks.length;i++)for(let j=0;j<+$('pairs').value;j++)for(const firstSide of ['player','cpu'])for(const env of ['D1','D2'])jobs.push({...o,coreId:'D',config:undefined,playerDeck:env==='D1'?SiegeLab.paired[SiegeLab.decks[i]].control:SiegeLab.decks[i],cpuDeck:env==='D1'?SiegeLab.paired[SiegeLab.decks[i]].control:SiegeLab.decks[i],experiment_id:env,seed:o.seed+i*100+j,pairId:`D13_${i}_${o.seed+j}`,pairArm:firstSide==='player'?'A':'B',firstSide});batch(jobs)};
let humanRows=[],humanReport=null,filterKeys=['gameVersion','cardSetVersion','coreVersion','logSchemaVersion'];function humanFilters(){return Object.fromEntries(filterKeys.map(k=>[k,$('vf_'+k)?.value||'all']))}function setupFilters(rows){let v=HumanAutoAnalyst.versions(rows);$('versionFilters').innerHTML=filterKeys.map(k=>`<label>${k}<select id="vf_${k}"><option value="all">すべて</option>${v[k].map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label>`).join('')}function loadHuman(rows,label='Human'){humanRows=rows;setupFilters(rows);$('progress').textContent=`${label} ${rows.length}試合を読込。分析を押してください。`}function analyzeHuman(){humanReport=HumanAutoAnalyst.analyze(humanRows,humanFilters());$('humanResults').hidden=false;$('humanResults').innerHTML=HumanAutoReportUI.render(humanReport);$('progress').textContent=`Human ${humanReport.core.validMatches}有効試合を分析`}$('humanLocal').onclick=()=>loadHuman(HumanPlaytest.load().matches,'端末Human');$('humanImport').onchange=async e=>{let all=[];for(const f of e.target.files){let d=JSON.parse(await f.text());all.push(...(Array.isArray(d)?d:d.matches||[]))}loadHuman(all,'Import Human')};$('humanAnalyze').onclick=analyzeHuman;$('improvementOpen').onclick=()=>{if(!humanReport)analyzeHuman();AutoImprovementUI.render($('improvementResults'),humanReport);$('improvementResults').scrollIntoView({behavior:'smooth'})};$('humanReportExport').onclick=()=>{if(!humanReport)analyzeHuman();HumanAutoAnalyst.download(humanReport,'tactics7_human_report_042.json')};$('imitationExport').onclick=()=>HumanAutoAnalyst.download(HumanAutoAnalyst.imitation(humanRows,humanFilters()),'tactics7_human_imitation_042.json');$('cloudEndpoint').value=window.TACTICS7_PLAYTEST_CONFIG?.adminExportEndpoint||'';$('humanCloud').onclick=async()=>{try{$('progress').textContent='クラウド取得中…';let rows=await PlaytestCloudAdmin.fetchMatches($('cloudEndpoint').value.trim(),$('cloudToken').value);loadHuman(rows,'Cloud Human')}catch(e){$('progress').textContent=e.message}};
$('export').onclick=()=>{let b=new Blob([JSON.stringify({schema:'0.13',generatedAt:new Date().toISOString(),summary:CoreLab.analyze(last),matches:last},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tactics7_siege_lab_013.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
